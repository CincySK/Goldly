version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: goldly
      POSTGRES_PASSWORD: goldly
      POSTGRES_DB: goldly
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - '9000:9000'
      - '9001:9001'
volumes:
  pg_data:
